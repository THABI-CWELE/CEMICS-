<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
  h2 { margin: 0 0 10px; text-align: center; }
  p { color: #666; font-size: 14px; text-align: center; margin-bottom: 20px; }
  label { font-size: 14px; font-weight: bold; display: block; margin-bottom: 5px; }
  input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; margin-bottom: 15px; }
  button { width: 100%; padding: 12px; background: #0066cc; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
  button:hover { background: #0052a3; }
  .links { text-align: center; margin-top: 15px; font-size: 14px; }
  .links a { color: #0066cc; text-decoration: none; }
  #message { text-align: center; font-size: 14px; margin-top: 10px; color: green; }
</style>
</head>
<body>

<div class="card">
  <h2>Forgot Password?</h2>
  <p>Enter your email and we will send you a reset link</p>
  
  <form id="forgotForm" action="/forgot-password" method="POST">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="example@email.com" required>
    
    <button type="submit">Send Reset Link</button>
  </form>

  <div id="message"></div>

  <div class="links">
    <a href="login.html">Back to Login</a>
  </div>
</div>

<script>
  // Frontend demo - remove this if you have a backend
  document.getElementById('forgotForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    document.getElementById('message').innerText = "Reset link sent to " + email + " (connect to backend to make it real)";
  });
</script>

</body>
</html>
